<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />
  
  <!-- Background Book -->
  <path d="M60 280 Q 256 220 256 320 Q 256 220 452 280 L 452 400 Q 256 340 256 440 Q 256 340 60 400 Z" fill="url(#bookGrad)" />
  
  <!-- Sparkle -->
  <path d="M380 60 Q 380 110 430 110 Q 380 110 380 160 Q 380 110 330 110 Q 380 110 380 60 Z" fill="#fde047" />
  <path d="M340 40 Q 340 60 360 60 Q 340 60 340 80 Q 340 60 320 60 Q 340 60 340 40 Z" fill="#fde047" />
  
  <!-- Graduation Cap -->
  <g filter="url(#shadow)">
    <!-- Cap Top -->
    <path d="M256 100 L 420 180 L 256 260 L 92 180 Z" fill="#ffffff" />
    <!-- Cap Base -->
    <path d="M160 220 L 160 320 Q 256 360 352 320 L 352 220 L 256 260 Z" fill="#f3f4f6" />
    <!-- Tassel String -->
    <path d="M256 180 Q 200 200 180 260" fill="none" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" />
    <!-- Tassel End -->
    <path d="M165 250 L 195 250 L 185 320 L 175 320 Z" fill="#fbbf24" />
    <circle cx="180" cy="250" r="15" fill="#fbbf24" />
  </g>
</svg>
